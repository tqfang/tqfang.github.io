name: Update Google Scholar Citations

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 08:00 UTC (16:00 Singapore time).
    - cron: "0 8 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GOOGLE_SCHOLAR_ID: Tb3rc34AAAAJ
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate citation data
        run: |
          cd google_scholar_crawler
          pip install -r requirements.txt
          # Scholar intermittently serves a CAPTCHA/anti-bot page to GitHub-hosted
          # runners. Retry before treating the weekly refresh as failed.
          for attempt in 1 2 3; do
            if python main.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 60))"
            fi
          done
          exit 1

      - name: Publish badge data
        run: |
          cp google_scholar_crawler/results/gs_data_shieldsio.json assets/google-scholar-citations.json
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add assets/google-scholar-citations.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update citation data"
          git push origin HEAD:master
